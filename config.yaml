# Solis-Monitor Configuration
# Environment variables can override any setting using SOLIS_ prefix
# Example: SOLIS_MODBUS_HOST=192.168.1.200

app:
  debug: DEBUG
  port: 8080
  timeout: 30s

poller:
  # Base interval between poll cycles
  interval: 5s
  # Retry attempts per block if read fails
  block_attempts: 2
  # Delay between retry attempts for same block
  block_retry_delay: 1s
  # Delay between successive block reads (0 = immediate)
  block_interval: 0s
  # Maximum duration for full poll cycle before aborting
  poll_timeout: 5s

modbus:
  # Address selects the transport via URL scheme: tcp://host:port or rtu://<device path>
  # (e.g. rtu:///dev/ttyUSB0). speed/data_bits/parity/stop_bits apply to rtu only.
  address: "tcp://stratopi.welan:502"
  timeout: 2s
  slave_id: 1

# modbus:
#   # Address selects the transport via URL scheme: tcp://host:port or rtu://<device path>
#   # (e.g. rtu:///dev/ttyUSB0). speed/data_bits/parity/stop_bits apply to rtu only.
#   address: "rtu:///tmp/ttyV1"
#   timeout: 2s
#   slave_id: 1
#   speed: 9600
#   data_bits: 8
#   parity: "N"
#   stop_bits: 1

# Local time at which the inverter's daily counters roll over (strict 24h HH:MM).
# Timezone comes from the TZ environment variable (time.Local), never from this file.
rollover:
  time: "23:59"

storage:
  path: ./data/solis.db
  # Retention of daily energy rows; monthly and yearly rows follow it. Only periods of
  # already frozen years are deleted, so computed values never shrink. Units: s, m, h,
  # d (day), w (week), y (365 days), combinable (e.g. "1y6w"). Default 1y.
  daily_retention: 10y
  # Retention of error/status change rows. Default 1y.
  error_retention: 10y
  wal_mode: true
  synchronous: NORMAL
  temp_store: MEMORY
  # Database maintenance settings (schema migrations always run on startup)
  # Enable database backup functionality
  enable_backup: true
  # Maximum number of backup files to keep (0 = unlimited)
  max_backups: 3
  # Interval for periodic online backups (e.g., "24h", "12h", "30m")
  backup_interval: 24h
  cleanup_interval: 20h

# There is no aggregator section: the aggregator is event-driven off the poller
# (debounce/heartbeat derived from poller.interval) and has no config knobs of its own.
# To recompute monthly/yearly values from daily data, stop the app and run:
#   solis backfill --years N
