# Solis Monitor on a serial RS485 adapter (Modbus RTU). In config.yaml set
#   modbus.address: "rtu:///dev/ttyUSB0"   (plus speed/parity if not 19200 8N2)
services:
  solis:
    image: ghcr.io/dombyte/solis:latest
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Berlin
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "httpcheck", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
