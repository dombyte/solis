# Solis Monitor with a Modbus TCP gateway (e.g. a Solis data logger or an RS485-to-TCP
# adapter). Put config.yaml (see config.yaml in this directory) next to this file.
services:
  solis:
    image: ghcr.io/dombyte/solis:latest
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Berlin # the inverter's local time zone
    # Required: when self-healing fails the app exits with code 1 and relies on the
    # container runtime to start it again.
    restart: unless-stopped
    stop_grace_period: 35s # the app bounds its own shutdown to 30 s
    healthcheck:
      test: ["CMD", "httpcheck", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
