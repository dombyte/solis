openapi: 3.0.4
info:
  title: Solis Inverter API
  description: |
    REST API for monitoring and reading data from Solis solar inverters via Modbus.

    This API provides access to real-time and historical data from Solis inverters.
    
    **API Base URL:** The API is served from the root of the application. All API endpoints are under `/api/`.
    
    **Documentation URL:** API documentation (Swagger UI) is available at `/docs/`.
  # Replaced at build time with VITE_APP_VERSION (the binary's version, see the Makefile).
  version: dev
  contact:
    name: API Support

servers:
  - url: ""
    description: Local server
  - url: http://{host}:{port}
    description: HTTP API server
    variables:
      host:
        default: localhost
        description: Server hostname or IP address
      port:
        default: "8080"
        description: Server port

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: |
        Returns the supervisor's snapshot of every restartable/watched component
        (modbus, poller, aggregator, websocket hub, storage, event bus, HTTP server).
        This endpoint never blocks on a component - it only reads the last published
        snapshot, and fails closed. A restartable component's first failure is `degraded`
        (200) while the supervisor restarts it; **503** once a restart of it failed (the
        restarted instance failed or went silent again - it stays 503 until an instance
        kept beating for the healthy grace), when its restart budget is exhausted, when a
        non-restartable part failed, or when the snapshot is stale (supervisor stalled).
        When the budget is exhausted the process exits 1 and the container runtime
        restarts it.
      operationId: getHealth
      responses:
        '200':
          description: All components are healthy (ok), or a component is recovering, failed for the first time or restarted and not yet proven healthy (degraded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "degraded"
                timestamp: "2026-08-03T10:00:00Z"
                components:
                  modbus:
                    state: "recovering"
                    last_beat: "2026-08-03T09:59:58Z"
                    restarts: 0
                    restartable: true
                  poller:
                    state: "healthy"
                    last_beat: "2026-08-03T10:00:00Z"
                    restarts: 0
                    restartable: true
        '503':
          description: A restart of a component failed or its restart budget is exhausted, a non-restartable part (storage, event bus, HTTP server) failed, or the supervisor snapshot is stale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "failed"
                component: "modbus"
                reason: "restart budget exhausted: no heartbeat for 31s (grace 30s)"
                timestamp: "2026-08-03T10:00:00Z"
                components:
                  modbus:
                    state: "failed"
                    reason: "restart budget exhausted: no heartbeat for 31s (grace 30s)"
                    restarts: 3
                    restartable: true

  /api/keys:
    get:
      tags:
        - Registers
      summary: List all register keys
      description: Returns metadata for every register, including its `store` destination and (when polled) its Modbus address.
      operationId: getKeys
      responses:
        '200':
          description: Array of register metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisterInfo'
              example:
                - key: "pv_energy_daily"
                  name: "PV Energy Daily"
                  address: 33035
                  data_type: "Uint16"
                  unit: "kWh"
                  store: "daily"
                  description: "PV Energy Daily (kWh) - Use with start/end query parameters for historical data"
                - key: "pv_energy_total"
                  name: "PV Energy Total"
                  data_type: "Uint32"
                  unit: "kWh"
                  store: "total"
                  description: "PV Energy Total (kWh)"
                - key: "solis_status"
                  name: "Solis Status"
                  address: 33095
                  data_type: "Uint16"
                  unit: ""
                  store: "status"
                  description: "Solis Status ()"

  /api/version:
    get:
      tags:
        - Health
      summary: Build information
      description: |
        Returns the build information of the running binary. The web UI and these API
        docs are embedded in the binary and built with the same version. The UI polls this
        endpoint and compares it with the version it was built with to detect an upgraded
        server.
      operationId: getVersion
      responses:
        '200':
          description: Build information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildInfo'
              example:
                version: "3.1.0"
                commit: "77cf3f1"
                build_date: "2026-10-01T12:00:00Z"
                go_version: "go1.26.8"

  /api/data/{key}:
    get:
      tags:
        - Registers
      summary: Get register data
      description: |
        Returns data for a specific register key. Behavior depends on the register's `store`
        (see `/api/keys`), not on its data type:

        - **`none` registers** (live cache-only values, e.g. `pv_total_power`): latest cached value (no query params)
        - **`daily` registers**: historical daily data if `start`/`end` are given, otherwise the latest value
        - **`monthly` registers**: historical monthly data if `start`/`end` are given, otherwise the latest value
        - **`yearly` registers**: historical yearly data if `start`/`end` are given, otherwise the latest value
        - **`total` registers**: always the lifetime/total value; `start`/`end` are rejected with 400
        - **`status` registers** (e.g. `solis_status`, `grid_fault_1`): the newest 1000 status changes with decoded information; `start`/`end` are rejected with 400
        - `none` registers also reject `start`/`end` with 400 (no history is stored)

        Values are stored at full precision; the JSON response rounds `value`/`raw_value` to two
        decimal places. There is no `?direct=true` mode - only the poller ever talks to the
        inverter, so `/api/data` always reads from the cache or SQLite.

        **Time range formats:**
        - Date: `YYYY-MM-DD` (e.g., `2026-08-01`)
        - Month: `YYYY-MM` (e.g., `2026-08`)
        - Year: `YYYY` (e.g., `2026`)
      operationId: getData
      parameters:
        - name: key
          in: path
          required: true
          description: The register key to query
          schema:
            type: string
          example: "pv_energy_daily"
        - name: start
          in: query
          required: false
          description: Start of time range (YYYY, YYYY-MM, or YYYY-MM-DD). For daily/monthly/yearly registers only.
          schema:
            type: string
          example: "2026-08-01"
        - name: end
          in: query
          required: false
          description: End of time range (YYYY, YYYY-MM, or YYYY-MM-DD). For daily/monthly/yearly registers only.
          schema:
            type: string
          example: "2026-08-31"

      responses:
        '200':
          description: Register data - can be a DataResponse, StatusResponse, DailyDataPoint array, MonthlyDataPoint array, YearlyDataPoint array, or TotalDataPoint
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DataResponse'
                  - $ref: '#/components/schemas/StatusResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/DailyDataPoint'
                  - type: array
                    items:
                      $ref: '#/components/schemas/MonthlyDataPoint'
                  - type: array
                    items:
                      $ref: '#/components/schemas/YearlyDataPoint'
                  - $ref: '#/components/schemas/TotalDataPoint'
              examples:
                current_register:
                  summary: Current/dynamic register response
                  value:
                    key: "pv_energy_total"
                    name: "PV Energy Total"
                    unit: "kWh"
                    value: 15280.5
                    raw_value: 152805
                    timestamp: "2026-08-04T09:19:19+02:00"
                status_register:
                  summary: Status register history response
                  value:
                    key: "solis_status"
                    name: "Solis Status"
                    history:
                      - timestamp: "2026-08-04T07:21:55.000Z"
                        status_decoded:
                          name: "Generating"
                          description: "Initializing / Generating"
                      - timestamp: "2026-07-31T09:27:45.783Z"
                        status_decoded:
                          name: "Generating"
                          description: "Initializing / Generating"
                      - timestamp: "2026-07-31T09:27:35.182Z"
                        status_decoded:
                          name: "StandbySynch"
                          description: "Standby synchronize"
                daily_history:
                  summary: Daily historical data for energy registers
                  value:
                    - date: "2026-08-01"
                      raw_value: 255
                      value: 25.5
                    - date: "2026-08-02"
                      raw_value: 283
                      value: 28.3
                    - date: "2026-08-03"
                      raw_value: 221
                      value: 22.1
                monthly_history:
                  summary: Monthly historical data for energy registers
                  value:
                    - month: "2026-07"
                      raw_value: 750
                      value: 75.0
                    - month: "2026-08"
                      raw_value: 825
                      value: 82.5
                yearly_history:
                  summary: Yearly historical data for energy registers
                  value:
                    - year: "2025"
                      raw_value: 8760
                      value: 876.0
                    - year: "2026"
                      raw_value: 4520
                      value: 452.0
                total_register:
                  summary: Total/lifetime register response
                  value:
                    key: "pv_energy_total"
                    name: "PV Energy Total"
                    unit: "kWh"
                    value: 15280.5
                    raw_value: 152805
                    timestamp: "2026-08-04T09:19:19+02:00"
        '400':
          description: |
            Invalid request: a malformed `start`/`end`, `start` after `end`, or a range on a
            register without history (`none`, `total`, `status`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_history:
                  value:
                    error: "Bad Request"
                    message: "unsupported for register: pv_energy_total (historical queries (start/end) are only supported for daily, monthly and yearly registers)"
                    code: 400
                bad_range:
                  value:
                    error: "Bad Request"
                    message: "invalid time range: start 2026-09-10 is after end 2026-09-01"
                    code: 400
        '404':
          description: Unknown register key, or a known key without a value yet (e.g. before the first poll)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Storage failure (details are logged, never returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The storage read exceeded `app.timeout`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/report:
    get:
      tags:
        - Reports
      summary: Energy report for a day range
      description: |
        Evaluates the daily energy rows of an inclusive day range (server time zone): totals
        of the eight energy series, self-sufficiency and self-consumption, where the PV energy
        went and where the consumption came from, battery and balance difference, day patterns, key
        figures with changes against a comparison period, and the range grouped into buckets.

        - Only days with a row for every series count; missing days are reported
          (`days` vs `complete_days`) and never treated as 0 kWh.
        - Ratios come from the summed energy of a period, never from averaged daily ratios.
        - The battery charge from PV is min(charge, PV − export) per day; the rest must have
          come from the grid (`battery_charge_from_grid_min`, a lower bound) and days where
          that exceeds 0.2 kWh are listed in `grid_charging_days`. `pv_direct_use` is
          PV − export − charge from PV, so the three parts of `pv_split` add up to the PV
          yield.
        - The net grid value (export − import) is not part of the report.
        - `battery_ratio_pct`, `balance_difference` and `balance_difference_pct` need at least 28 complete days
          (the battery level at the start and end is not stored).
        - Comparison: energy changes in kWh and percent, ratio changes in percentage points.
          When either period has missing days or the periods differ in length
          (`matched: true`) the changes compare only
          the days both periods have data for (the same date a year earlier, or the same
          position in the previous period): each figure's `compared` and `base` then cover
          those `matched_days`, while `value` stays the total of the whole period.

        Energy is in kWh, shares in percent, values rounded to two decimals; `null` = no data.
        `format=csv` downloads one row per bucket instead, `format=pdf` the A4 report
        (summary, energy flows, patterns and comparison, table).
      operationId: getReport
      parameters:
        - name: from
          in: query
          required: true
          description: First day (YYYY-MM-DD)
          schema:
            type: string
            format: date
          example: "2026-10-01"
        - name: to
          in: query
          required: true
          description: Last day (YYYY-MM-DD, inclusive, not after today, at most 3660 days after `from`). Today itself is still in progress and is left out (see `today_excluded`); a range of today alone is a 400.
          schema:
            type: string
            format: date
          example: "2026-10-31"
        - name: compare
          in: query
          required: false
          description: |
            Comparison period: `last_year` (same dates one year earlier, 29 Feb → 28 Feb),
            `previous` or `none`. `previous`: whole months → the same number of months before
            (Oct → Sep, a year → the year before); a period to date starting on the 1st → the
            same days of the period before (1–29 Oct → 1–29 Sep, 1 Jan–29 Oct → the same
            dates a year earlier; a day past the month end becomes its last day); otherwise
            the same number of days directly before.
          schema:
            type: string
            enum: [last_year, previous, none]
            default: last_year
        - name: granularity
          in: query
          required: false
          description: |
            Bucket size; default automatic: up to 62 days by day, up to 731 days by month,
            longer by year
          schema:
            type: string
            enum: [day, month, year]
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv, pdf]
            default: json
      responses:
        '200':
          description: The report (JSON), or an attachment `solis-report-<from>_<to>.csv` / `.pdf`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
            text/csv:
              schema:
                type: string
              example: |
                period,from,to,partial,days,complete_days,pv_kwh,consumption_kwh,household_kwh,backup_kwh,grid_import_kwh,grid_export_kwh,battery_charge_kwh,battery_discharge_kwh,pv_direct_use_est_kwh,battery_charge_from_pv_est_kwh,self_sufficiency_pct,self_consumption_pct
                2026-10-01,2026-10-01,2026-10-01,false,1,1,13.50,9.40,8.80,0.60,0.80,4.30,2.20,2.00,7.00,2.20,91.49,68.15
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Malformed or out-of-range `from`/`to`, or an unknown `compare`, `granularity` or `format`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Bad Request"
                message: "invalid report parameters: to 2026-11-02 is after today 2026-10-29"
                code: 400
        '500':
          description: Storage failure (details are logged, never returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The storage reads exceeded `app.timeout`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ws:
    get:
      tags:
        - WebSocket
      summary: WebSocket for real-time updates
      description: |
        Establishes a WebSocket connection for a per-client key subscription. Same-origin only
        (the upgrader rejects cross-origin requests). There is no history over WebSocket - only
        the latest values for subscribed keys; use the REST `/api/data/{key}` endpoints for
        history.

        **To connect:** Use a WebSocket client with URL `ws://{host}:{port}/ws`

        **Protocol:**
        1. Connect to the WebSocket endpoint.
        2. Send `subscribe` with the keys you need; the server replies with a `snapshot` of just
           those keys.
        3. The server pushes `update` frames (coalesced ~75ms) whenever a subscribed key's value
           or status changes - only changed keys are included, diffed per client.
        4. Send `unsubscribe` to drop keys you no longer need (unknown keys are ignored
           silently; no reply).
        5. `ping` is answered with `pong`; clients use it as a liveness check (browsers do not
           expose WebSocket control-frame pongs to JavaScript).
        6. Unknown keys in `subscribe` never drop the connection; the server replies with an
           `error` frame naming them.
        7. When a subscribed key disappears from the server cache (e.g. a derived value
           after a failed poll), the next `update` lists it in `removed`; drop its value.
           `removed` only names keys this client was previously sent.

        **Client → Server messages** (`ClientMessage`):
        ```json
        { "type": "subscribe",   "keys": ["pv_total_power", "solis_status"] }
        { "type": "unsubscribe", "keys": ["solis_status"] }
        { "type": "ping" }
        ```

        **Server → Client messages:**
        ```json
        { "type": "snapshot", "values": { "pv_total_power": { "value": 5230, "timestamp": "2026-08-04T09:19:19+02:00", "unit": "W" } } }
        { "type": "update",   "ts": "2026-08-04T09:19:20+02:00", "values": { "pv_total_power": { "value": 5102.5 } } }
        { "type": "update",   "ts": "2026-08-04T09:19:25+02:00", "values": {}, "removed": ["battery_power_signed"] }
        { "type": "error",    "code": "unknown_keys", "message": "unknown keys ignored", "keys": ["foo"] }
        { "type": "pong" }
        ```
        `snapshot` values include `timestamp` and `unit`; `update` values carry only `value` (and
        `status_decoded` for status/fault keys) to keep frames small.

        **Note:** This endpoint cannot be tested directly through Swagger UI. Use a dedicated WebSocket client.
      operationId: connectWebSocket
      responses:
        '101':
          description: WebSocket connection established - Switching Protocols
          headers:
            Upgrade:
              schema:
                type: string
                enum: [websocket]
            Connection:
              schema:
                type: string
                enum: [Upgrade]
        '403':
          description: Cross-origin upgrade rejected (the upgrader is same-origin only)
        '503':
          description: The WebSocket hub is restarting; retry with backoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Service Unavailable"
                message: "websocket hub restarting"
                code: 503

components:
  schemas:
    # Health Check
    ComponentStatus:
      type: object
      description: One supervised component's entry in the health snapshot
      required:
        - state
        - restarts
        - restartable
      properties:
        state:
          type: string
          enum: [healthy, recovering, failed]
          example: "healthy"
        reason:
          type: string
          description: Explains a non-healthy state
          example: "restart budget exhausted: no heartbeat for 31s (grace 30s)"
        last_beat:
          type: string
          format: date-time
          description: Last heartbeat (restartable components only)
          example: "2026-08-03T10:00:00Z"
        restarts:
          type: integer
          description: Consecutive-failure counter
          example: 0
        restartable:
          type: boolean
          description: True for managed components (modbus, poller, aggregator, websocket); false for watched parts (storage, cache, bus, http server)
          example: true

    HealthResponse:
      type: object
      description: |
        Fail-closed supervisor snapshot. Never blocks on a component. `status` is `ok` or
        `degraded` (HTTP 200), or `failed` (HTTP 503) once a restart failed, the restart budget
        is exhausted, a non-restartable part failed or the snapshot is stale.
      required:
        - status
        - components
        - timestamp
      properties:
        status:
          type: string
          enum: [ok, degraded, failed]
          example: "ok"
        component:
          type: string
          description: Name of the failed component (only set when status is failed)
          example: "modbus"
        reason:
          type: string
          description: Human-readable failure reason (only set when status is failed)
          example: "restart budget exhausted: no heartbeat for 31s (grace 30s)"
        components:
          type: object
          description: Every supervised component/part, keyed by name
          additionalProperties:
            $ref: '#/components/schemas/ComponentStatus'
        timestamp:
          type: string
          format: date-time
          description: When the snapshot was taken
          example: "2026-08-03T10:00:00Z"

    # Register Metadata
    BuildInfo:
      type: object
      required: [version, commit, build_date, go_version]
      properties:
        version:
          type: string
          description: Release version (`dev` for local builds without a tag)
          example: "3.1.0"
        commit:
          type: string
          description: Short commit hash (`unknown` when not set at build time)
        build_date:
          type: string
          description: Build (commit) date, RFC 3339 (`unknown` when not set at build time)
        go_version:
          type: string
          description: Go toolchain the binary was built with

    RegisterInfo:
      type: object
      required:
        - key
        - name
        - data_type
        - unit
        - store
        - description
      properties:
        key:
          type: string
          description: Unique identifier for this register
          example: "pv_energy_daily"
        name:
          type: string
          description: Human-readable name
          example: "PV Energy Daily"
        address:
          type: integer
          format: uint16
          minimum: 0
          description: Modbus register address; omitted for computed registers (monthly/yearly/total, net values, derived live values), which have no address
          example: 33057
        data_type:
          type: string
          enum: [Uint16, Int16, Uint32, Int32, Float32, String, Bool]
          description: Type of value stored in this register
          example: "Uint32"
        unit:
          type: string
          description: Unit of measurement
          example: "W"
        store:
          type: string
          enum: [none, daily, monthly, yearly, total, status]
          description: |
            Where the value is stored: `none` = cache only (live values), `status` = written to
            error_data on change, `daily`/`monthly`/`yearly`/`total` = the matching history table
          example: "daily"
        description:
          type: string
          description: Combined name and unit for display; ends with a note on start/end query parameters for daily, monthly and yearly registers
          example: "PV Power Total (W)"

    # Data Responses
    DataResponse:
      type: object
      description: Response for current/dynamic/total register requests. Only fields with data are included (nullable fields are omitted).
      properties:
        key:
          type: string
          description: Register key
          example: "pv_energy_total"
        name:
          type: string
          description: Register name
          example: "PV Energy Total"
        unit:
          type: string
          description: Unit of measurement
          example: "kWh"
        value:
          type: number
          description: Decoded/scaled value, rounded to 2 decimal places
          example: 15280.5
        raw_value:
          type: number
          description: Raw value from the device before scaling
          example: 152805
        timestamp:
          type: string
          format: date-time
          description: When the value was last updated (RFC3339 format)
          example: "2026-08-03T10:00:00+02:00"
        status_decoded:
          type: object
          description: For status/fault registers - decoded status bits. Can be a map with name/description or an array of strings.
          additionalProperties: true
          example:
            name: "Generating"
            description: "Initializing / Generating"

    # Status Response
    StatusHistoryEntry:
      type: object
      description: A single status/fault entry with timestamp and decoded status
      required:
        - timestamp
        - status_decoded
      properties:
        timestamp:
          type: string
          format: date-time
          description: When this status was recorded (UTC, millisecond precision)
          example: "2026-08-04T07:21:55.000Z"
        status_decoded:
          type: object
          description: Decoded status information - for solis_status is a map with name and description, for bitmask faults is an array of active fault names
          additionalProperties: true
          example:
            name: "Generating"
            description: "Initializing / Generating"

    StatusResponse:
      type: object
      description: Response for status register requests - returns ALL historical status entries
      required:
        - key
        - name
        - history
      properties:
        key:
          type: string
          description: Register key
          example: "solis_status"
        name:
          type: string
          description: Register name
          example: "Solis Status"
        history:
          type: array
          description: The newest 1000 status changes, sorted by timestamp (latest first)
          items:
            $ref: '#/components/schemas/StatusHistoryEntry'

    # Historical Data Points
    DailyDataPoint:
      type: object
      required:
        - date
        - value
        - raw_value
      properties:
        date:
          type: string
          format: date
          description: Date of the data point (YYYY-MM-DD format)
          example: "2026-08-03"
        value:
          type: number
          description: Decoded/scaled value for this date, rounded to 2 decimal places
          example: 25.5
        raw_value:
          type: number
          description: Raw value from the device before scaling
          example: 255

    MonthlyDataPoint:
      type: object
      required:
        - month
        - value
        - raw_value
      properties:
        month:
          type: string
          description: Month of the data point (YYYY-MM format)
          example: "2026-08"
        value:
          type: number
          description: Decoded/scaled value for this month, rounded to 2 decimal places
          example: 825.0
        raw_value:
          type: number
          description: Raw value from the device before scaling
          example: 8250

    YearlyDataPoint:
      type: object
      required:
        - year
        - value
        - raw_value
      properties:
        year:
          type: string
          description: Year of the data point (YYYY format)
          example: "2026"
        value:
          type: number
          description: Decoded/scaled value for this year, rounded to 2 decimal places
          example: 4520.0
        raw_value:
          type: number
          description: Raw value from the device before scaling
          example: 45200

    TotalDataPoint:
      type: object
      required:
        - value
        - raw_value
        - timestamp
      properties:
        value:
          type: number
          description: Decoded/scaled lifetime/total value, rounded to 2 decimal places
          example: 15280.5
        raw_value:
          type: number
          description: Raw value from the device before scaling
          example: 152805
        timestamp:
          type: string
          format: date-time
          description: When the value was last updated (RFC3339 format)
          example: "2026-08-04T09:19:19+02:00"

    # WebSocket Messages
    ClientMessage:
      type: object
      description: Client → server frame
      required:
        - type
      properties:
        type:
          type: string
          enum: [subscribe, unsubscribe, ping]
          example: "subscribe"
        keys:
          type: array
          description: Register keys to subscribe/unsubscribe (omitted for ping)
          items:
            type: string
          example: ["pv_total_power", "solis_status"]

    ValueDTO:
      type: object
      description: One key's value on the wire, rounded to 2 decimal places. Snapshots include timestamp/unit; updates carry only value (and status_decoded for status/fault keys).
      required:
        - value
      properties:
        value:
          type: number
          description: Decoded/scaled value, rounded to 2 decimal places
          example: 15280.5
        timestamp:
          type: string
          format: date-time
          description: When the value was last updated (snapshots only)
          example: "2026-08-04T09:19:19+02:00"
        unit:
          type: string
          description: Unit of measurement (snapshots only)
          example: "kWh"
        status_decoded:
          type: object
          description: For status/fault registers - decoded status bits
          additionalProperties: true
          example:
            name: "Generating"
            description: "Initializing / Generating"

    SnapshotMessage:
      type: object
      description: Server reply to subscribe, with the current values of the newly subscribed keys
      required:
        - type
        - values
      properties:
        type:
          type: string
          example: "snapshot"
        values:
          type: object
          description: Map of register keys to their current ValueDTO
          additionalProperties:
            $ref: '#/components/schemas/ValueDTO'

    UpdateMessage:
      type: object
      description: Server push of changed, subscribed keys only, coalesced roughly every 75ms
      required:
        - type
        - ts
        - values
      properties:
        type:
          type: string
          example: "update"
        ts:
          type: string
          format: date-time
          description: Frame time
          example: "2026-08-04T09:19:20+02:00"
        values:
          type: object
          description: Map of changed register keys to their new ValueDTO
          additionalProperties:
            $ref: '#/components/schemas/ValueDTO'
        removed:
          type: array
          description: Subscribed keys that disappeared from the server cache; clients drop their values
          items:
            type: string
          example: ["battery_power_signed"]

    ErrorMessage:
      type: object
      description: Reports a protocol problem; the connection stays open
      required:
        - type
        - code
        - message
      properties:
        type:
          type: string
          example: "error"
        code:
          type: string
          enum: [unknown_keys, bad_request]
          example: "unknown_keys"
        message:
          type: string
          example: "unknown keys ignored"
        keys:
          type: array
          description: The offending keys (unknown_keys only)
          items:
            type: string
          example: ["foo"]

    # Report
    ReportEnergy:
      type: object
      description: The eight energy series in kWh
      properties:
        pv: {type: number, example: 403.7}
        consumption: {type: number, description: "The inverter's counter of all loads: household + backup + a small remainder it assigns to neither", example: 330.5}
        household: {type: number, example: 314.7}
        backup: {type: number, example: 15.8}
        grid_import: {type: number, example: 78.7}
        grid_export: {type: number, example: 132.8}
        battery_charge: {type: number, example: 82.1}
        battery_discharge: {type: number, example: 72.9}

    ReportSplit:
      type: object
      description: |
        A three-part split in kWh and percent. `pv_split`: solar = used directly,
        battery = charged from PV, grid = exported (adds up to the PV yield).
        `consumption_sources`: solar = from PV,
        battery = discharged, grid = imported.
      properties:
        solar: {type: number}
        battery: {type: number}
        grid: {type: number}
        solar_pct: {type: number, nullable: true}
        battery_pct: {type: number, nullable: true}
        grid_pct: {type: number, nullable: true}

    ReportSummary:
      type: object
      properties:
        days: {type: integer, description: Calendar days of the period, example: 31}
        complete_days: {type: integer, description: Days with a row for every series, example: 31}
        total:
          allOf: [{$ref: '#/components/schemas/ReportEnergy'}]
          nullable: true
        per_day:
          allOf: [{$ref: '#/components/schemas/ReportEnergy'}]
          nullable: true
        self_sufficiency_pct: {type: number, nullable: true, description: "100 × (1 − import / consumption)", example: 76.19}
        self_consumption_pct: {type: number, nullable: true, description: "100 × (PV − export) / PV", example: 67.1}
        pv_direct_use: {type: number, nullable: true, description: "Estimate: Σ (PV − export − charge from PV) per day; also contains the PV-side balance difference (e.g. conversion losses)", example: 190.7}
        battery_charge_from_pv: {type: number, nullable: true, description: "Estimate: Σ min(charge, PV − export) per day", example: 80.2}
        battery_charge_from_grid_min: {type: number, nullable: true, description: "charge − charge from PV: grid charging that must have happened (lower bound)", example: 1.9}
        pv_split:
          allOf: [{$ref: '#/components/schemas/ReportSplit'}]
          nullable: true
        consumption_sources:
          allOf: [{$ref: '#/components/schemas/ReportSplit'}]
          nullable: true
        battery_ratio_pct: {type: number, nullable: true, description: "100 × discharge / charge, the plain quotient of the two battery counters (≥ 28 complete days). Not an efficiency: the counters are not calibrated against each other and real devices report values above 100", example: 88.79}
        balance_difference: {type: number, nullable: true, description: "(PV + import + discharge) − (consumption + export + charge) in kWh: energy the counters do not account for (conversion losses, standby use, counter inaccuracy); ≥ 28 complete days", example: 9.9}
        balance_difference_pct: {type: number, nullable: true, description: Balance difference as percent of the energy in, example: 1.78}
        grid_charging_days:
          type: array
          items: {type: string, format: date}
          example: ["2026-10-28"]

    ReportFigure:
      type: object
      description: |
        A key figure. `kind` energy = kWh, ratio = percent.
        `change` is compared − base (kWh, or percentage points for ratios); `change_pct`
        is the relative change of energy figures. `compared` equals `value` unless the
        comparison is matched.
      properties:
        id:
          type: string
          enum: [pv, consumption, self_sufficiency, self_consumption, grid_import, grid_export, battery_charge, battery_discharge]
        kind: {type: string, enum: [energy, ratio]}
        better: {type: string, enum: [higher, lower, neutral], description: Which change is an improvement}
        value: {type: number, nullable: true, description: The period over all its complete days, example: 403.7}
        compared: {type: number, nullable: true, description: "The period's value the change is computed from (matched days only when the comparison is matched)", example: 403.7}
        base: {type: number, nullable: true, description: "The comparison period's value the change is computed from", example: 371.0}
        change: {type: number, nullable: true, example: 32.7}
        change_pct: {type: number, nullable: true, example: 8.81}

    ReportDayValue:
      type: object
      nullable: true
      properties:
        date: {type: string, format: date}
        value: {type: number}

    ReportResponse:
      type: object
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        granularity: {type: string, enum: [day, month, year]}
        summary: {$ref: '#/components/schemas/ReportSummary'}
        figures:
          type: array
          items: {$ref: '#/components/schemas/ReportFigure'}
        comparison:
          type: object
          nullable: true
          properties:
            mode: {type: string, enum: [last_year, previous]}
            from: {type: string, format: date}
            to: {type: string, format: date}
            summary: {$ref: '#/components/schemas/ReportSummary'}
            matched: {type: boolean, description: Either period has missing days or they differ in length; the figures compare matched days only}
            matched_days: {type: integer, description: Number of compared day pairs (0 unless matched)}
        patterns:
          type: object
          properties:
            best_pv: {$ref: '#/components/schemas/ReportDayValue'}
            lowest_pv: {$ref: '#/components/schemas/ReportDayValue'}
            max_consumption: {$ref: '#/components/schemas/ReportDayValue'}
            max_import: {$ref: '#/components/schemas/ReportDayValue'}
            weekday_consumption_per_day: {type: number, nullable: true}
            weekend_consumption_per_day: {type: number, nullable: true}
            weekday_days: {type: integer}
            weekend_days: {type: integer}
            low_import_days: {type: integer, description: Days with less than 0.5 kWh grid import (the inverter draws a little from the grid even on fully self-supplied days)}
        today_excluded: {type: boolean, description: "The requested range ended today. Today's counters are still running, so the report ends yesterday (`to`)"}
        buckets:
          type: array
          items:
            type: object
            properties:
              key: {type: string, description: "YYYY-MM-DD, YYYY-MM or YYYY", example: "2026-10"}
              from: {type: string, format: date}
              to: {type: string, format: date}
              partial: {type: boolean, description: The range cuts this month or year}
              summary: {$ref: '#/components/schemas/ReportSummary'}

    # Error Responses
    Error:
      type: object
      required:
        - error
        - message
        - code
      properties:
        error:
          type: string
          description: Error type
          example: "Bad Request"
        message:
          type: string
          description: Error message
          example: "unsupported for register: pv_energy_total (historical queries (start/end) are only supported for daily, monthly and yearly registers)"
        code:
          type: integer
          description: HTTP status code
          example: 400

