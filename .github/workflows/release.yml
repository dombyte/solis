name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  pull-requests: read # checks.yml gate job

jobs:
  # A release only builds from a commit whose checks pass (same workflow as for PRs).
  checks:
    uses: ./.github/workflows/checks.yml

  guard:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} FETCH_HEAD; then
            echo "::error::Tag ${{ github.ref_name }} must be on main branch to release"
            exit 1
          fi
  build:
    runs-on: ubuntu-latest
    needs:
      - guard
      - checks
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout the specific tag
        run: git checkout ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Get Go version
        id: goversion
        run: echo "GOVERSION=$(go version | awk '{print $3;}')" >> "$GITHUB_ENV"
      # Changelog and compare range always start at the last stable tag, so v1.2.0-rc1
      # and v1.2.0 both compare against v1.1.0 (never v1.2.0-rc1...v1.2.0).
      - name: Find previous stable tag
        run: |
          prev="$(git describe --tags --abbrev=0 --exclude '*-*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"
          fi
      # Frontend and docs are built by goreleaser's before hooks.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs/package-lock.json
      # Required by goreleaser dockers_v2 for multi-platform builds (binfmt emulation).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERSION: ${{ env.GOVERSION }}
