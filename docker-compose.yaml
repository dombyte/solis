---
services:
  app:
    image: ghcr.io/dombyte/solis:latest
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080"
    restart: unless-stopped   # required: the app exits 1 when self-healing fails
    stop_grace_period: 35s    # the app bounds its own shutdown to 30 s
    environment:
      - TZ=Europe/Berlin
    devices:
      - /dev/ttyAMA0:/dev/ttyAMA0
    healthcheck:
      test: ["CMD", "httpcheck", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
