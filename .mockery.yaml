# Mock generation: go run github.com/vektra/mockery/v2@latest
# Mocks live next to the consumer package in internal/<pkg>/mocks and are never hand-edited.
with-expecter: true
disable-version-string: true
resolve-type-alias: false
issue-845-fix: true
dir: "{{.InterfaceDir}}/mocks"
mockname: "Mock{{.InterfaceName}}"
outpkg: mocks
filename: "mock_{{.InterfaceName | snakecase}}.go"
packages:
  github.com/dombyte/solis/internal/eventbus:
    interfaces:
      Publisher:
      Subscriber:
  github.com/dombyte/solis/internal/health:
    interfaces:
      Component:
      Reporter:
  github.com/dombyte/solis/internal/storage:
    interfaces:
      PollerStore:
      AggregatorStore:
      ReadStore:
      KeyLookup:
      BackfillTx:
  github.com/dombyte/solis/internal/poller:
    interfaces:
      Reader:
      Source:
      Cache:
      Decoder:
      Registry:
  github.com/dombyte/solis/internal/aggregator:
    interfaces:
      Cache:
      Registry:
  github.com/dombyte/solis/internal/websocket:
    interfaces:
      Snapshotter:
      KeySet:
      HubSource:
  github.com/dombyte/solis/internal/service:
    interfaces:
      CacheReader:
      HealthSnapshotter:
      Registry:
      StatusDecoder:
  github.com/dombyte/solis/internal/http/handlers:
    interfaces:
      ReadService:
  github.com/dombyte/solis/internal/database:
    interfaces:
      Cleaner:
  github.com/dombyte/solis/internal/solis:
    interfaces:
      Lookup:
  github.com/dombyte/solis/internal/utils:
    interfaces:
      Clock:
      Timer:
      Ticker:
