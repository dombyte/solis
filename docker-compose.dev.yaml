---
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args: # set by `make docker`; plain `docker compose build` falls back to dev/unknown
        VITE_GIT_COMMIT_HASH: ${VITE_GIT_COMMIT_HASH:-dev}
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Europe/Berlin
    ports:
      # - "4174:8080"
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "4"
        reservations:
          memory: 512m
    # devices:
    #   - /tmp/ttyV1:/tmp/ttyV1
    healthcheck:
      test: ["CMD", "httpcheck", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
